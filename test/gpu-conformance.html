<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pending</title>
  </head>
  <body>
    <pre id="result">pending</pre>
    <script type="module">
      // WebGPU conformance harness for the WGSL forward pass.
      //
      // Pins a GPU forward pass to the same frozen fixture the TypeScript one is pinned to
      // (test/forward.test.ts), so a matmul that disagrees with the numpy reference fails here
      // rather than silently returning a wrong cron.
      //
      // Serve this file's directory as the document root; the fixtures are relative URLs:
      //   node scripts/gpu-test.mjs
      //
      // Entry point, to be implemented by the WGSL forward pass:
      //
      //   window.runConformance(makeLogits)
      //     makeLogits(bytes: Uint8Array, manifest) => (ids: number[]) => Promise<Float32Array> | Float32Array
      //
      // `bytes`/`manifest` are a PURE-FLOAT32 view: every int8 tensor has already been
      // dequantized (per-row symmetric, q[r*cols+c] * scales[r]) into a fresh buffer, and the
      // manifest's tensors are all kind 'f32' at offsets into it. The WGSL side therefore never
      // needs to know quantization exists. Layout matches src/forward.ts: y = x @ W^T with W
      // row-major (out, in), all f32 little-endian.
      //
      // The pass returns logits for the LAST position only, over the full vocabulary.
      // Results land in document.title and #result as <=300 chars of JSON:
      //   {"ok":true,"cases":N,"worst":<float>,"adapter":"<adapter info string>"}
      //   {"ok":false,"error":"<msg>"}

      const TOL = 1e-4;
      const MAX_PAYLOAD = 300;
      const resultEl = document.getElementById('result');

      let adapterLabel = 'unknown';
      window.harnessReady = false;

      function publish(value) {
        let text = JSON.stringify(value);
        // The adapter description is the only unbounded field; trim it to hold the cap.
        for (let i = 0; i < 5 && text.length > MAX_PAYLOAD && typeof value.adapter === 'string'; i += 1) {
          value.adapter = value.adapter.slice(0, value.adapter.length - (text.length - MAX_PAYLOAD));
          text = JSON.stringify(value);
        }
        document.title = text;
        resultEl.textContent = text;
      }

      function fail(message) {
        publish({ ok: false, error: String(message) });
      }

      // Reports whether a WebGPU adapter exists, without needing a forward pass. scripts/gpu-test.mjs
      // uses this to tell "this box cannot do WebGPU at all" (skip) from "the pass is wrong" (fail).
      async function probeAdapter() {
        if (!navigator.gpu) {
          return { ok: false, error: 'no WebGPU adapter: navigator.gpu is undefined' };
        }
        let adapter;
        try {
          adapter = await navigator.gpu.requestAdapter();
        } catch (err) {
          return { ok: false, error: `no WebGPU adapter: requestAdapter() threw ${err}` };
        }
        if (!adapter) {
          return { ok: false, error: 'no WebGPU adapter: requestAdapter() returned null' };
        }
        const info = adapter.info || {};
        const parts = [info.vendor, info.architecture, info.device, info.description].filter(Boolean);
        adapterLabel = parts.join(' ') || 'unknown';
        return { ok: true, adapter: adapterLabel };
      }
      window.probeAdapter = probeAdapter;

      // Dequantize every tensor to f32 so the WGSL never sees int8.
      function toFloat32Model(bytes, manifest) {
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        const source = manifest.tensors;
        let floats = 0;
        const tensors = source.map((tensor) => {
          const count = tensor.shape.reduce((a, b) => a * b, 1);
          const entry = { name: tensor.name, kind: 'f32', shape: tensor.shape, offset: floats * 4 };
          floats += count;
          return entry;
        });
        const out = new Float32Array(floats);
        source.forEach((tensor, index) => {
          const count = tensor.shape.reduce((a, b) => a * b, 1);
          const target = tensors[index].offset / 4;
          if (tensor.kind === 'f32') {
            for (let i = 0; i < count; i += 1) {
              out[target + i] = view.getFloat32(tensor.offset + i * 4, true);
            }
            return;
          }
          if (tensor.kind !== 'i8') {
            throw new Error(`unknown tensor kind ${tensor.kind} for ${tensor.name}`);
          }
          if (tensor.scaleOffset === undefined) {
            throw new Error(`int8 tensor ${tensor.name} has no scaleOffset`);
          }
          const rows = tensor.shape[0];
          const cols = count / rows;
          for (let r = 0; r < rows; r += 1) {
            const scale = view.getFloat32(tensor.scaleOffset + r * 4, true);
            for (let c = 0; c < cols; c += 1) {
              out[target + r * cols + c] = view.getInt8(tensor.offset + r * cols + c) * scale;
            }
          }
        });
        return { bytes: new Uint8Array(out.buffer), manifest: { ...manifest, tensors } };
      }

      async function runConformance(makeLogits) {
        try {
          if (typeof makeLogits !== 'function') {
            throw new Error('runConformance(makeLogits) needs a function');
          }
          const [bytesRes, manifestRes, referenceRes] = await Promise.all([
            fetch('fixtures/tiny.bin'),
            fetch('fixtures/tiny.json'),
            fetch('fixtures/tiny-reference.json'),
          ]);
          const failed = [
            ['tiny.bin', bytesRes],
            ['tiny.json', manifestRes],
            ['tiny-reference.json', referenceRes],
          ].filter(([, res]) => !res.ok);
          if (failed.length > 0) {
            throw new Error(`fixture fetch failed: ${failed.map(([n, r]) => `${n} ${r.status}`).join(', ')}`);
          }

          const raw = new Uint8Array(await bytesRes.arrayBuffer());
          const manifest = await manifestRes.json();
          const reference = await referenceRes.json();
          if (!Array.isArray(reference.cases) || reference.cases.length === 0) {
            throw new Error('reference has no cases');
          }

          const model = toFloat32Model(raw, manifest);
          const logitsFor = makeLogits(model.bytes, model.manifest);
          if (typeof logitsFor !== 'function') {
            throw new Error('makeLogits must return a (ids) => logits function');
          }

          let worst = 0;
          let cases = 0;
          for (const testCase of reference.cases) {
            const got = await logitsFor(testCase.ids);
            if (!got || typeof got.length !== 'number') {
              throw new Error(`case ${cases}: makeLogits returned ${got}`);
            }
            if (got.length !== testCase.logits.length) {
              throw new Error(`case ${cases}: got ${got.length} logits, expected ${testCase.logits.length}`);
            }
            for (let i = 0; i < got.length; i += 1) {
              const delta = Math.abs(got[i] - testCase.logits[i]);
              if (delta > worst) worst = delta;
            }
            cases += 1;
          }
          // The reference is rounded to 5 decimals on the way out, so this is the rounding floor.
          if (!(worst < TOL)) {
            throw new Error(`case ${cases - 1}: worst |delta| ${worst} >= ${TOL}`);
          }
          publish({ ok: true, cases, worst: Number(worst.toFixed(9)), adapter: adapterLabel });
        } catch (err) {
          fail(err instanceof Error ? err.message : err);
        }
      }
      window.runConformance = runConformance;

      (async function boot() {
        // Fail before the fixture fetches so the message is about WebGPU, not about 404s.
        const probe = await probeAdapter();
        if (!probe.ok) {
          window.harnessReady = true;
          fail(probe.error);
          return;
        }
        window.harnessReady = true;
        if (typeof window.makeLogits === 'function') {
          await runConformance(window.makeLogits);
        } else {
          resultEl.textContent =
            'adapter ready; call window.runConformance(makeLogits) with the WGSL forward pass, ' +
            'or define window.makeLogits before load';
        }
      })();
    </script>
    <!-- After the inline module, so window.makeLogits exists by the time boot() resumes. -->
    <script type="module" src="gpu-bundle.js"></script>
  </body>
</html>
